<!doctype html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Қайнау сабағын бағалау</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@500;600;700;800;900&family=Unbounded:wght@600;700;800;900&display=swap">
<style>
/* Layout: flag-blue ceremonial header over a white working surface; huge touch targets readable from the back of a classroom. Single light theme by request (no dark background). */
:root{
  color-scheme: light;
  --paper:#F3F9FC; --surface:#FFFFFF; --sky:#00A3C2; --sky-deep:#04709E; --sky-soft:#E1F3F8;
  --navy:#0A3760; --ink:#0F2740; --muted:#4A6074; --line:#CBDFEA;
  --gold:#F2B705; --gold-deep:#9A7000; --gold-soft:#FFF4D2;
  --idle:#EEF2F6; --idle-line:#B3C3D1;
  --ok:#14773A; --ok-deep:#0C5A2B; --ok-soft:#E3F3E8;
  --bad:#C62828; --bad-deep:#9B1B1B; --bad-soft:#FCE8E8;
  --c-green:#14773A; --c-yellow:#D9A300; --c-blue:#1F6FD1; --c-purple:#7A3FB8; --c-orange:#E0640F; --c-red:#C62828;
  --f-display:"Unbounded", "Segoe UI", Arial, sans-serif;
  --f-body:"Golos Text", "Segoe UI", Roboto, Arial, sans-serif;
  --radius:16px;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{background:var(--paper);color:var(--ink)}
body{margin:0;font-family:var(--f-body);font-size:18px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select{font-family:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:4px solid var(--gold);outline-offset:3px}
h1,h2,h3{text-wrap:balance;margin:0}
p{margin:0}
.wrap{max-width:1320px;margin:0 auto;padding-inline:clamp(16px,3vw,40px)}
#printRoot{display:none}
body.locked{overflow:hidden}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;font:800 20px/1.15 var(--f-body);letter-spacing:.02em;padding:16px 28px;min-height:60px;border-radius:14px;border:3px solid transparent;text-decoration:none}
.btn-primary{background:var(--navy);color:#fff}
.btn-primary:hover{background:#0F4778}
.btn-gold{background:var(--gold);color:var(--navy);border-color:#D9A300}
.btn-gold:hover{background:#FFC61A}
.btn-ghost{background:var(--surface);color:var(--navy);border-color:var(--line)}
.btn-ghost:hover{border-color:var(--sky-deep)}
.btn-danger{background:var(--surface);color:var(--bad);border-color:var(--bad)}
.btn-danger:hover{background:var(--bad-soft)}
.btn-xl{font-size:26px;padding:22px 44px;min-height:80px;border-radius:18px}
.btn-sm{font-size:17px;min-height:48px;padding:10px 18px}

/* ---------- top nav ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:3px solid var(--sky)}
.topbar-in{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;font:800 17px/1.1 var(--f-display);color:var(--navy);margin-right:auto;background:none;border:0;padding:6px 4px}
.brand svg{width:34px;height:34px}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{font:800 18px/1 var(--f-body);letter-spacing:.03em;padding:14px 18px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--navy)}
.tab:hover{border-color:var(--sky-deep)}
.tab.cur{background:var(--navy);border-color:var(--navy);color:#fff}
.tab.cls{border-color:var(--gold);background:var(--gold-soft)}
.tab.cls.cur{background:var(--gold);color:var(--navy);border-color:#D9A300}

.sample-banner{background:var(--gold-soft);border-bottom:2px solid var(--gold);color:var(--navy);font-weight:700;font-size:17px}
.sample-banner .wrap{padding-block:10px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}

/* ---------- home ---------- */
.home{padding-block:20px 48px;display:grid;gap:24px}
.home-top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.pill-class{font:800 clamp(20px,2.2vw,26px)/1 var(--f-display);color:var(--navy);background:var(--surface);border:3px solid var(--sky);border-radius:999px;padding:14px 26px}
.teacher{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:12px 20px;text-align:right;display:grid}
.teacher span{font-size:16px;color:var(--muted);font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.teacher b{font-size:clamp(19px,2vw,24px);color:var(--navy)}
.hero{position:relative;overflow:hidden;border-radius:28px;background:linear-gradient(155deg,#19BAD6 0%,var(--sky) 42%,var(--sky-deep) 100%);color:#fff;padding:clamp(28px,4vw,56px);padding-left:calc(clamp(28px,4vw,56px) + 56px);padding-bottom:clamp(90px,10vw,140px)}
.orn-v{position:absolute;left:0;top:0;bottom:0;width:52px;height:100%;background:rgba(0,0,0,.08)}
.hero-sun{position:absolute;right:clamp(-150px,-7vw,-30px);top:clamp(-110px,-5vw,-20px);width:clamp(240px,32vw,440px);height:auto;opacity:.95;pointer-events:none}
.hero-mount{position:absolute;left:0;right:0;bottom:0;width:100%;height:clamp(80px,11vw,150px);pointer-events:none}
.hero-body{position:relative;display:grid;gap:18px;max-width:min(900px,66%)}
.eyebrow{font:800 16px/1 var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:#FFF3C4}
.hero h1{font:900 clamp(34px,5.4vw,72px)/1.06 var(--f-display);letter-spacing:-.01em;text-shadow:0 2px 0 rgba(0,40,70,.25)}
.hero-sub{font:600 clamp(19px,2.1vw,26px)/1.35 var(--f-body);max-width:46ch}
.goals{display:flex;flex-wrap:wrap;gap:10px}
.goals span{background:rgba(255,255,255,.16);border:2px solid rgba(255,255,255,.45);border-radius:12px;padding:8px 14px;font-weight:600;font-size:17px}
.goals b{color:#FFE27A;margin-right:6px}
.hero .btn-xl{justify-self:start;margin-top:8px;box-shadow:0 6px 0 #B88A00}
.home-row{display:grid;grid-template-columns:1.1fr 1fr;gap:24px}
.quote,.structure{background:var(--surface);border:2px solid var(--line);border-radius:22px;overflow:hidden}
.band{display:block;width:100%;height:26px;background:var(--sky)}
.quote-in{padding:22px 28px 26px;display:grid;gap:10px}
.label{font:800 15px/1 var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--sky-deep)}
.quote blockquote{margin:0;font:700 clamp(22px,2.4vw,30px)/1.4 var(--f-body);color:var(--navy)}
.structure .quote-in{gap:14px}
.struct-list{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.struct-list div{background:var(--sky-soft);border-radius:14px;padding:12px;text-align:center;display:grid;gap:4px}
.struct-list b{font:800 30px/1 var(--f-display);color:var(--navy)}
.struct-list span{font-size:15px;font-weight:600;color:var(--muted);line-height:1.2}
.struct-total{font:800 20px/1.3 var(--f-body);color:var(--navy)}
.struct-total em{font-style:normal;background:var(--gold-soft);border-radius:8px;padding:2px 8px}

/* ---------- groups ---------- */
.page{padding-block:24px 56px;display:grid;grid-template-columns:minmax(0,1fr);gap:24px}
.page-title{font:900 clamp(30px,3.6vw,46px)/1.1 var(--f-display);color:var(--navy)}
.group-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,480px),1fr));gap:20px}
.gcard{display:grid;grid-template-columns:1fr auto;gap:8px 16px;text-align:left;background:var(--surface);border:3px solid var(--line);border-radius:24px;padding:26px 28px;color:var(--ink)}
.gcard:hover{border-color:var(--sky-deep)}
.gnum{justify-self:start;font:900 clamp(24px,2.6vw,32px)/1 var(--f-display);background:var(--gold);color:var(--navy);border-radius:12px;padding:10px 16px}
.gname{grid-column:1/-1;font:900 clamp(30px,3.6vw,46px)/1.05 var(--f-display);color:var(--navy);letter-spacing:-.01em;overflow-wrap:anywhere}
.gsub{grid-column:1/-1;font:700 clamp(19px,1.9vw,24px)/1.3 var(--f-body);color:var(--sky-deep)}
.gicon{width:76px;height:76px;color:var(--sky);grid-row:1;grid-column:2}
.gmeta{grid-column:1/-1;display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.gmeta span{background:var(--sky-soft);border-radius:10px;padding:6px 12px;font-weight:700;font-size:17px;color:var(--navy)}

/* ---------- group page ---------- */
.ghead{position:relative;overflow:hidden;border-radius:24px;background:linear-gradient(155deg,#19BAD6,var(--sky-deep));color:#fff;padding:22px 28px 22px 84px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.ghead .orn-v{width:56px}
.ghead .gnum{font-size:clamp(26px,3vw,36px)}
.ghead-title{display:grid;gap:4px;min-width:0;flex:1 1 320px}
.ghead h1{font:900 clamp(26px,4.4vw,56px)/1.05 var(--f-display);overflow-wrap:anywhere}
.ghead p{font:700 clamp(18px,2vw,24px)/1.2 var(--f-body);color:#E8FBFF}
.ghead .gicon{color:#fff;margin-left:auto;opacity:.9;width:84px;height:84px}
.stepper{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.step{display:grid;gap:4px;justify-items:center;padding:12px 6px;border-radius:14px;border:3px solid var(--line);background:var(--surface);color:var(--navy)}
.step b{font:800 clamp(18px,2vw,26px)/1 var(--f-display)}
.step span{font-size:14px;font-weight:700;color:var(--muted);text-align:center;line-height:1.15}
.step:hover{border-color:var(--sky-deep)}
.step.cur{background:var(--navy);border-color:var(--navy);color:#fff}
.step.cur span{color:#CFE9F7}
.step.done{border-color:var(--sky)}
.panel{background:var(--surface);border:2px solid var(--line);border-radius:24px;padding:clamp(18px,3vw,32px);display:grid;gap:22px}
.stage-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.stage-no{font:900 20px/1 var(--f-display);background:var(--sky-soft);color:var(--sky-deep);border-radius:10px;padding:10px 14px}
.stage-title{font:900 clamp(24px,3vw,38px)/1.1 var(--f-display);color:var(--navy)}
.stage-pts{margin-left:auto;font:800 20px/1 var(--f-body);background:var(--gold-soft);border:2px solid var(--gold);color:var(--navy);border-radius:12px;padding:10px 16px}
.hint{font-size:18px;color:var(--muted);font-weight:600}
.stmt{border:2px solid var(--line);border-radius:20px;padding:20px;display:grid;gap:16px;background:#FBFDFE}
.stmt-head{display:flex;gap:16px;align-items:flex-start}
.stmt-num{flex:none;width:48px;height:48px;border-radius:50%;background:var(--navy);color:#fff;font:900 22px/48px var(--f-display);text-align:center}
.stmt-text{font:700 clamp(21px,2.3vw,28px)/1.3 var(--f-body);color:var(--ink)}
.desc{margin-top:6px;font-size:17px;color:var(--muted)}
.desc .pt{display:inline-block;margin-left:6px;background:var(--sky-soft);color:var(--sky-deep);font-weight:800;border-radius:8px;padding:1px 8px}
.chips{display:flex;flex-wrap:wrap;gap:12px}
.chip{display:inline-flex;align-items:center;gap:10px;font:800 clamp(22px,2.2vw,28px)/1.1 var(--f-body);letter-spacing:.02em;padding:14px 24px;min-height:66px;border-radius:14px;border:3px solid var(--idle-line);background:var(--idle);color:var(--ink)}
.chip:hover{border-color:var(--sky-deep)}
.chip .tick{font-size:1.1em;line-height:1}
.chip.on{background:var(--ok);border-color:var(--ok-deep);color:#fff;box-shadow:inset 0 -4px 0 rgba(0,0,0,.18)}
.chip.on:hover{border-color:#063D1C}
.chip.static{cursor:default;background:var(--surface);border-color:var(--sky)}
.chip.static:hover{border-color:var(--sky)}
.chip.sel{background:var(--navy);border-color:var(--navy);color:#fff}
.chip small{font-size:.7em;font-weight:700;opacity:.85}
.tally{border-top:2px dashed var(--line);padding-top:18px;display:grid;gap:12px}
.tally h3{font:800 18px/1 var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.tally-row{display:flex;flex-wrap:wrap;gap:10px}
.tally-item{display:inline-flex;gap:10px;align-items:baseline;background:var(--sky-soft);border-radius:12px;padding:8px 14px;font-size:20px;font-weight:700;color:var(--navy)}
.tally-item b{font-weight:900}
.nav-row{display:flex;gap:12px;flex-wrap:wrap;justify-content:space-between}
.nav-row .btn-primary{margin-left:auto}

/* names */
.name-grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))}
.name-row{display:flex;align-items:center;gap:12px}
.name-row .num{flex:none;width:44px;font:900 26px/1 var(--f-display);color:var(--sky-deep);text-align:right}
.name-input{flex:1;min-width:0;font:800 26px/1.2 var(--f-body);padding:14px 18px;border:3px solid var(--idle-line);border-radius:14px;background:var(--surface)}
.name-input:focus{border-color:var(--sky-deep);outline:none;box-shadow:0 0 0 4px var(--sky-soft)}
.name-input::placeholder{color:#9AAEBF;font-weight:600}
.empty{display:grid;gap:16px;justify-items:start;padding:12px 0}
.empty p{font-size:22px;font-weight:700;color:var(--navy)}

/* stage 3 */
.q-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,500px),1fr));gap:12px}
.q-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap;border:2px solid var(--line);border-radius:18px;padding:12px 14px 12px 20px;background:#FBFDFE}
.q-label{font:900 clamp(22px,2.4vw,30px)/1 var(--f-display);color:var(--navy);margin-right:auto;min-width:6.5em}
.ans{font:900 clamp(20px,2vw,24px)/1 var(--f-body);letter-spacing:.04em;min-width:150px;min-height:62px;padding:12px 18px;border-radius:14px;border:3px solid var(--idle-line);background:var(--idle);color:var(--ink)}
.ans:hover{border-color:var(--sky-deep)}
.ans.ok.on{background:var(--ok);border-color:var(--ok-deep);color:#fff;box-shadow:inset 0 -4px 0 rgba(0,0,0,.2)}
.ans.bad.on{background:var(--bad);border-color:var(--bad-deep);color:#fff;box-shadow:inset 0 -4px 0 rgba(0,0,0,.2)}
.ans.on:hover{border-color:#222}
.group-result{display:flex;align-items:center;justify-content:center;gap:24px;flex-wrap:wrap;background:var(--navy);color:#fff;border-radius:22px;padding:22px 28px}
.group-result .lbl{font:900 clamp(24px,3vw,36px)/1 var(--f-display);color:#FFE27A}
.group-result .val{font:900 clamp(56px,8vw,96px)/1 var(--f-display)}
.group-result .val span{color:#9FD5EC}
.group-result p{flex-basis:100%;text-align:center;font-size:18px;font-weight:600;color:#D6EEF8}

/* stage 4 */
.picker{display:grid;gap:14px}
.picker-top{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.picker-top label{font:900 22px/1 var(--f-display);color:var(--navy)}
.picker select{font:800 24px/1.2 var(--f-body);padding:12px 16px;border-radius:14px;border:3px solid var(--sky);background:var(--surface);min-width:min(100%,320px);max-width:100%}
.who{display:flex;align-items:center;gap:16px;flex-wrap:wrap;background:var(--sky-soft);border-radius:20px;padding:16px 22px}
.who-name{font:900 clamp(34px,5vw,60px)/1.05 var(--f-display);color:var(--navy);margin-right:auto;overflow-wrap:anywhere;min-width:0}
.who .btn{min-height:52px}
.task{border:2px solid var(--line);border-radius:20px;padding:20px;display:grid;gap:14px;background:#FBFDFE}
.task-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.task-head h3{font:900 clamp(21px,2.4vw,28px)/1.1 var(--f-display);color:var(--navy)}
.task-head .pts{font-weight:800;color:var(--muted);font-size:18px}
.task-score{margin-left:auto;font:900 clamp(28px,3.2vw,40px)/1 var(--f-display);color:var(--navy);background:var(--surface);border:3px solid var(--line);border-radius:14px;padding:8px 16px}
.task-score.full{border-color:var(--ok);color:var(--ok)}
.crit{font-size:17px;color:var(--muted)}
.crit b{color:var(--ink)}
.cb{display:flex;align-items:center;gap:16px;width:100%;text-align:left;padding:14px 18px;min-height:70px;border-radius:14px;border:3px solid var(--idle-line);background:var(--surface);color:var(--ink);font:700 clamp(19px,2vw,23px)/1.25 var(--f-body)}
.cb:hover{border-color:var(--sky-deep)}
.cb .box{flex:none;width:42px;height:42px;border-radius:9px;border:3px solid #5A7084;background:var(--surface);display:grid;place-items:center;font:900 28px/1 var(--f-body);color:var(--ok)}
.cb .cb-text{flex:1;min-width:0}
.cb .cb-hint{display:block;font-size:.78em;font-weight:600;color:var(--muted);margin-top:2px}
.cb .cb-pt{flex:none;font-size:16px;font-weight:800;color:var(--muted)}
.cb.on{background:var(--ok);border-color:var(--ok-deep);color:#fff}
.cb.on .box{border-color:#fff}
.cb.on .cb-hint,.cb.on .cb-pt{color:#D8F2E0}
.cb.on:hover{border-color:#063D1C}
.ind-total{display:flex;align-items:center;justify-content:center;gap:20px;flex-wrap:wrap;background:var(--gold-soft);border:3px solid var(--gold);border-radius:22px;padding:18px 24px;color:var(--navy)}
.ind-total .lbl{font:900 clamp(22px,2.6vw,32px)/1 var(--f-display)}
.ind-total .val{font:900 clamp(48px,6.5vw,80px)/1 var(--f-display)}

/* tables */
.tbl-wrap{overflow-x:auto;border:2px solid var(--line);border-radius:18px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:12px 14px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
th{font:800 15px/1.2 var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--sky-soft)}
td{font-size:21px;font-weight:700}
td.nm{text-align:left;font:900 clamp(21px,2.2vw,26px)/1.1 var(--f-body);color:var(--navy)}
td.tot{font:900 24px/1 var(--f-display);color:var(--navy)}
td.ten{font:900 26px/1 var(--f-display);color:var(--sky-deep)}
td.miss{white-space:normal;text-align:left;font-size:16px;font-weight:600;color:var(--muted);min-width:240px}
.yes{color:var(--ok);font-weight:900}
.no{color:#8A9BAB;font-weight:800}

/* class view */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:14px}
.stat{background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:18px 20px;display:grid;gap:6px}
.stat span{font:800 15px/1.2 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stat b{font:900 clamp(36px,4vw,52px)/1 var(--f-display);color:var(--navy)}
.stat b small{font-size:.5em;color:var(--muted)}
.stat em{font-style:normal;font-size:16px;font-weight:600;color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.brief{background:var(--navy);color:#fff;border-radius:24px;padding:24px 28px;display:grid;gap:14px}
.brief h2{font:900 clamp(22px,2.6vw,30px)/1.1 var(--f-display);color:#FFE27A}
.brief-lines{display:grid;gap:8px;font-size:20px;font-weight:600}
.brief-lines div{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid rgba(255,255,255,.18);padding-bottom:6px}
.brief-lines b{font-weight:900}
.brief-sub{font:800 15px/1 var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:#9FD5EC;margin-top:4px}
.brief-next{background:rgba(255,255,255,.1);border-radius:14px;padding:14px 16px;font-size:20px;font-weight:700}
.brief .btn{justify-self:start}
.best{background:var(--surface);border:3px solid var(--gold);border-radius:24px;padding:24px 28px;display:grid;gap:16px;align-content:start}
.best h2{font:900 clamp(22px,2.6vw,30px)/1.1 var(--f-display);color:var(--navy)}
.best-list{display:grid;gap:12px}
.best-item{display:flex;align-items:center;gap:16px;flex-wrap:wrap;background:var(--gold-soft);border-radius:16px;padding:14px 18px;text-align:left;border:2px solid transparent}
.best-item:hover{border-color:var(--gold)}
.best-item .nm{font:900 clamp(26px,3vw,36px)/1.05 var(--f-display);color:var(--navy);margin-right:auto;overflow-wrap:anywhere}
.best-item .sc{font:800 22px/1.1 var(--f-body);color:var(--navy);text-align:right}
.best-item .sc b{display:block;font:900 30px/1 var(--f-display);color:var(--gold-deep)}
.map{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,520px),1fr));gap:16px}
.mcard{background:var(--surface);border:3px solid var(--line);border-radius:22px;padding:20px 22px;display:grid;gap:12px;align-content:start}
.mcard-head{display:flex;align-items:center;gap:12px}
.dot{flex:none;width:28px;height:28px;border-radius:50%;background:var(--dot);box-shadow:0 0 0 4px color-mix(in srgb,var(--dot) 22%,transparent)}
.mcard h3{font:900 clamp(18px,2vw,23px)/1.15 var(--f-display);color:var(--navy)}
.mcard .cnt{margin-left:auto;font:900 26px/1 var(--f-display);color:var(--navy)}
.mcard .rec{font-size:17px;font-weight:600;color:var(--muted)}
.mcard .rec b{color:var(--ink)}
.mcard .chip{font-size:clamp(20px,2vw,24px);min-height:56px;padding:10px 18px;background:var(--surface);border-color:var(--dot)}
.mcard .none{font-size:18px;color:#8A9BAB;font-weight:700}
.note{font-size:17px;color:var(--muted);font-weight:600;background:var(--sky-soft);border-radius:14px;padding:12px 16px}
details.ga{background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:18px 22px}
details.ga summary{cursor:pointer;font:900 clamp(20px,2.2vw,26px)/1.2 var(--f-display);color:var(--navy)}
.ga-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,520px),1fr));gap:14px;margin-top:16px}
.ga-card{border:2px solid var(--line);border-radius:16px;padding:16px 18px;display:grid;gap:8px}
.ga-card h4{margin:0;font:900 20px/1.2 var(--f-display);color:var(--navy);display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between}
.ga-card ul{margin:0;padding-left:20px;display:grid;gap:4px;font-size:17px}
.ga-card .obj{font-size:16px;font-weight:700;color:var(--sky-deep)}
.tag{display:inline-block;font-size:14px;font-weight:800;background:var(--sky-soft);color:var(--sky-deep);border-radius:6px;padding:0 6px;margin-right:4px}
.actions{display:flex;gap:12px;flex-wrap:wrap}
.section-title{font:900 clamp(24px,3vw,34px)/1.1 var(--f-display);color:var(--navy)}
.section-sub{font-size:18px;color:var(--muted);font-weight:600;margin-top:6px}

/* ---------- full-screen result ---------- */
#overlay{position:fixed;inset:0;z-index:50;background:var(--paper);overflow-y:auto;padding-bottom:env(safe-area-inset-bottom,0px)}
.ov-bar{position:sticky;top:0;z-index:2;background:var(--surface);border-bottom:3px solid var(--sky);padding-top:env(safe-area-inset-top,0px)}
.ov-bar .wrap{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding-block:10px}
.ov-bar .count{font-weight:800;color:var(--muted);font-size:18px;margin-inline:auto}
.ov-body{padding-block:24px 48px}

.sheet{background:var(--surface);max-width:1180px;margin:0 auto;border-radius:26px;overflow:hidden;border:2px solid var(--line);box-shadow:0 14px 40px rgba(10,55,96,.12)}
.sheet-head{position:relative;overflow:hidden;background:linear-gradient(150deg,#19BAD6,var(--sky-deep));color:#fff;padding:18px clamp(20px,3vw,36px);display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.sheet-head .sun{position:absolute;right:-70px;top:-80px;width:190px;height:190px;opacity:.28}
.sheet-head p:last-of-type{text-align:right}
.sheet-head p{position:relative;font:800 clamp(15px,1.5vw,18px)/1.3 var(--f-body)}
.sheet-head .topic{font:800 clamp(16px,1.7vw,21px)/1.25 var(--f-display);max-width:44ch}
.sheet .band{height:22px}
.sheet-main{padding:clamp(20px,3.4vw,40px);display:grid;gap:clamp(16px,2.4vw,28px)}
.sheet-name{font:900 clamp(44px,8vw,104px)/1.02 var(--f-display);color:var(--navy);text-align:center;letter-spacing:-.01em;overflow-wrap:anywhere}
.sheet-group{text-align:center;font:800 clamp(22px,2.8vw,34px)/1.2 var(--f-body);color:var(--sky-deep)}
.sheet-scores{display:flex;justify-content:center;gap:clamp(14px,3vw,40px);flex-wrap:wrap}
.score-box{text-align:center;border-radius:22px;padding:16px clamp(20px,3vw,40px);background:var(--sky-soft);display:grid;gap:6px;min-width:min(100%,280px)}
.score-box .n{font:900 clamp(56px,9vw,112px)/1 var(--f-display);color:var(--navy);white-space:nowrap}
.score-box .n span{font-size:.5em;color:var(--muted)}
.score-box small{font:800 16px/1 var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.score-box.ten{background:var(--gold-soft);border:3px solid var(--gold)}
.parts{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.part{border:2px solid var(--line);border-radius:14px;padding:10px 12px;text-align:center;display:grid;gap:2px}
.part span{font-size:15px;font-weight:700;color:var(--muted);line-height:1.2}
.part b{font:900 clamp(22px,2.4vw,30px)/1.1 var(--f-display);color:var(--navy)}
.fb-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.fb{border-radius:20px;padding:20px 22px;border:3px solid;display:grid;gap:10px;align-content:start}
.fb h3{font:900 clamp(20px,2.2vw,26px)/1.15 var(--f-display)}
.fb ul{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.fb li{font:700 clamp(19px,2vw,24px)/1.3 var(--f-body)}
.fb .gnote{font-size:clamp(16px,1.6vw,19px);font-weight:600;color:var(--muted);border-top:2px dashed currentColor;padding-top:8px}
.fb.good{border-color:var(--ok);background:var(--ok-soft)}
.fb.good h3{color:var(--ok)}
.fb.need{border-color:var(--gold);background:var(--gold-soft)}
.fb.need h3{color:var(--gold-deep)}
.fb.next{border-color:var(--sky-deep);background:var(--sky-soft)}
.fb.next h3{color:var(--sky-deep)}
.motto{text-align:center;font:800 clamp(21px,2.6vw,32px)/1.35 var(--f-body);color:var(--navy);text-wrap:balance}
.motto .star{color:var(--gold)}
.sheet-foot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-top:2px solid var(--line);padding-top:14px;font-size:17px;font-weight:600;color:var(--muted)}
.sheet-foot b{color:var(--navy)}

/* ---------- modal & toast ---------- */
#modal{position:fixed;inset:0;z-index:80;background:rgba(10,40,70,.45);display:grid;place-items:center;padding:16px}
.modal-box{background:var(--surface);border-radius:24px;border:3px solid var(--bad);max-width:620px;width:100%;padding:28px;display:grid;gap:22px}
.modal-box p{font:800 clamp(22px,2.6vw,28px)/1.35 var(--f-body);color:var(--navy)}
.modal-box .actions{justify-content:flex-end}
.btn-red{background:var(--bad);color:#fff;border-color:var(--bad-deep)}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:90;background:var(--navy);color:#fff;font-weight:800;font-size:19px;padding:14px 22px;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:calc(100% - 32px);text-align:center}

/* live sync badge */
.home-left{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.sync{display:inline-flex;align-items:center;gap:8px;font:800 15px/1.2 var(--f-body);border-radius:999px;padding:7px 14px;border:2px solid var(--line);background:var(--surface);color:var(--muted)}
.sync i{width:11px;height:11px;border-radius:50%;background:#9AAEBF;flex:none}
.sync.live{border-color:var(--ok);color:var(--ok);background:var(--ok-soft)}
.sync.live i{background:var(--ok);box-shadow:0 0 0 4px rgba(20,119,58,.18)}
.sync.ro{border-color:var(--gold);color:var(--gold-deep);background:var(--gold-soft)}
.sync.ro i{background:var(--gold)}
.sync.wait i{background:var(--sky)}
.topbar .sync{margin-right:auto}
.topbar .brand{margin-right:0}

/* ---------- new lesson ---------- */
.tab.les{border-color:var(--sky);background:var(--sky-soft)}
.tab.les.cur{background:var(--sky-deep);border-color:var(--sky-deep);color:#fff}
.hero-actions{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:8px}
.hero-actions .btn-xl{margin-top:0}
.btn-white{background:#fff;color:var(--sky-deep);border-color:#fff}
.btn-white:hover{background:var(--sky-soft)}
.lsecs{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.lsecs .step b{font-size:clamp(15px,1.5vw,19px);font-family:var(--f-body);font-weight:900;text-align:center;line-height:1.15}
.lsec{display:grid;gap:22px}
.rule{display:flex;gap:16px;align-items:flex-start;background:var(--gold-soft);border:3px solid var(--gold);border-radius:20px;padding:20px 24px}
.rule .mark{flex:none;width:44px;height:44px;border-radius:12px;background:var(--bad);color:#fff;display:grid;place-items:center;font:900 24px/1 var(--f-display)}
.rule p{font:800 clamp(22px,2.5vw,32px)/1.3 var(--f-body);color:var(--navy)}
.rule p em{font-style:italic;color:var(--sky-deep)}
.lead{font:600 clamp(20px,2.1vw,26px)/1.5 var(--f-body);color:var(--ink);max-width:62ch}
.lgrid{display:grid;grid-template-columns:1.15fr 1fr;gap:22px;align-items:start}
.lcol{display:grid;gap:18px;min-width:0}
.fig{background:var(--sky-soft);border-radius:22px;padding:16px;display:grid;gap:8px;justify-items:center}
.fig svg{width:100%;max-width:520px;height:auto}
.fig figcaption{font-size:17px;font-weight:700;color:var(--muted);text-align:center}
.callout{border-radius:18px;padding:16px 20px;display:grid;gap:6px;border:3px solid}
.callout h3{font:900 18px/1.2 var(--f-body);letter-spacing:.06em;text-transform:uppercase;display:flex;gap:10px;align-items:center}
.callout p{font:700 clamp(19px,2vw,24px)/1.4 var(--f-body)}
.callout.attn{border-color:var(--sky-deep);background:var(--surface)}
.callout.attn h3{color:var(--sky-deep)}
.callout.mem{border-color:var(--ok);background:var(--ok-soft)}
.callout.mem h3{color:var(--ok)}
.callout .ic{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:18px;flex:none}
.callout.attn .ic{background:var(--sky-deep)}
.callout.mem .ic{background:var(--ok)}
.cmp{width:100%;border-collapse:separate;border-spacing:0;font-variant-numeric:normal}
.cmp th,.cmp td{white-space:normal;text-align:left;padding:14px 16px;font-size:clamp(18px,1.8vw,22px)}
.cmp th{font-size:16px}
.cmp td:first-child{font-weight:800;color:var(--muted);font-size:17px;width:28%}
.cmp td{font-weight:700}
.vals td,.vals th{font-size:clamp(19px,1.9vw,23px)}
.vals td:first-child{text-align:left;font-weight:800}
.subst td:first-child small{display:block;font-size:.72em;font-weight:600;color:var(--muted)}
.subst th{white-space:normal}
.subst .unit{text-transform:none;letter-spacing:0;white-space:nowrap}
.subst .r{font-family:"Times New Roman",Georgia,serif;font-size:1.25em;text-transform:none}
.fcards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.fcard{min-width:0;background:var(--surface);border:3px solid var(--line);border-radius:20px;padding:20px;display:grid;gap:10px;justify-items:center;text-align:center;align-content:start}
.fcard span{font:800 16px/1.2 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.fcard .fx{font:800 clamp(34px,5vw,64px)/1.1 "Times New Roman",Georgia,serif;font-style:italic;color:var(--navy);display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:.25em;max-width:100%}
.fcard .fx.main{color:var(--bad)}
.frac{display:inline-grid;text-align:center;font-size:.8em;line-height:1.05}
.frac>span:first-child{border-bottom:3px solid currentColor;padding:0 .15em}
.formula-big{background:var(--navy);color:#fff;border-radius:22px;padding:22px 26px;display:grid;gap:14px;justify-items:center;text-align:center}
.formula-big .fx{font:800 clamp(44px,6vw,80px)/1.1 "Times New Roman",Georgia,serif;font-style:italic;color:#FFE27A}
.formula-big p{font:600 clamp(18px,1.9vw,23px)/1.4 var(--f-body);color:#E3F3FA;max-width:56ch}
.terms{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.terms span{background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.3);border-radius:12px;padding:8px 14px;font-size:18px;font-weight:700}
.terms b{color:#FFE27A;font-family:"Times New Roman",Georgia,serif;font-style:italic;font-size:1.2em}
.example{border:3px solid var(--sky);border-radius:22px;padding:22px;display:grid;gap:14px;background:var(--surface)}
.example h3{font:900 clamp(20px,2.2vw,26px)/1.2 var(--f-display);color:var(--navy)}
.example .task-q{font:700 clamp(20px,2.2vw,26px)/1.4 var(--f-body)}
.ex-steps{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.ex-steps li{font:700 clamp(19px,2vw,24px)/1.45 var(--f-body);background:var(--sky-soft);border-radius:14px;padding:12px 16px}
.ex-steps li.last{background:var(--ok);color:#fff}
.alt{display:grid;gap:18px}
.alt-read{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.alt-read div{background:var(--surface);border:3px solid var(--line);border-radius:20px;padding:16px;text-align:center;display:grid;gap:6px}
.alt-read span{font:800 15px/1.2 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.alt-read b{font:900 clamp(34px,4.6vw,60px)/1 var(--f-display);color:var(--navy);white-space:nowrap}
.alt-read small{font-size:.45em;color:var(--muted)}
.alt-read .hot{border-color:var(--bad);background:var(--bad-soft)}
.alt-read .hot b{color:var(--bad)}
.alt-range{width:100%;height:44px;accent-color:var(--sky-deep)}
.presets{display:flex;flex-wrap:wrap;gap:10px}
.presets .btn{font-size:17px;min-height:50px;padding:10px 16px}
.presets .btn.cur{background:var(--navy);color:#fff;border-color:var(--navy)}
.chain{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;font:900 clamp(18px,2vw,24px)/1.2 var(--f-body);color:var(--navy)}
.chain span{background:var(--sky-soft);border-radius:12px;padding:10px 14px}
.chain i{font-style:normal;color:var(--sky-deep)}
.alt-fig svg{width:100%;max-width:none;height:auto;display:block}
.lq{display:grid;gap:14px;counter-reset:q}
.lq li{list-style:none;display:flex;gap:16px;align-items:flex-start;background:var(--surface);border:3px solid var(--line);border-radius:20px;padding:18px 20px;font:700 clamp(21px,2.3vw,28px)/1.4 var(--f-body)}
.lq li::before{counter-increment:q;content:counter(q);flex:none;width:48px;height:48px;border-radius:50%;background:var(--gold);color:var(--navy);font:900 22px/48px var(--f-display);text-align:center}
.lq ol,.lq{margin:0;padding:0}
/* lab */
.lab-ctrl{display:flex;flex-wrap:wrap;gap:14px;align-items:center;background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:14px 18px}
.lab-clock{display:grid;gap:2px;margin-right:auto}
.lab-clock span{font:800 14px/1 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.lab-clock b{font:900 clamp(30px,3.4vw,44px)/1 var(--f-display);color:var(--sky-deep);font-variant-numeric:tabular-nums}
.lab-clock.tot b{font-size:clamp(20px,2vw,26px);color:var(--navy)}
.lab-grid{display:grid;grid-template-columns:5fr 7fr;gap:18px}
.lab-card{background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:16px;display:grid;gap:10px;align-content:start;min-width:0}
.lab-card h3{font:900 clamp(18px,1.9vw,22px)/1.2 var(--f-display);color:var(--navy);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.lab-card h3 .badge{margin-left:auto;font:800 15px/1 var(--f-body);border-radius:999px;padding:6px 12px;background:var(--idle);color:var(--muted)}
.lab-card h3 .badge.on{background:var(--gold-soft);color:var(--gold-deep)}
.lab-card svg{width:100%;height:auto;display:block}
.lab-now{display:flex;justify-content:space-between;align-items:center;background:var(--sky-soft);border-radius:14px;padding:10px 14px;font-weight:800;font-size:18px}
.lab-now b{font:900 28px/1 var(--f-display);color:var(--bad)}
.g-grid{stroke:#E3EDF3;stroke-width:1}
.g-axis{stroke:var(--ink);stroke-width:2}
.g-t{fill:var(--muted);font:600 13px var(--f-body)}
.g-title{fill:var(--ink);font:800 14px var(--f-body)}
.g-100{stroke:var(--bad);stroke-width:1.6;stroke-dasharray:6 4}
.g-100t{fill:var(--bad);font:900 13px var(--f-body)}
.g-line{fill:none;stroke:var(--sky-deep);stroke-width:3.5;stroke-linejoin:round;stroke-linecap:round}
.g-pt{fill:#fff;stroke:var(--sky-deep);stroke-width:3}
.g-val{fill:var(--navy);font:800 12px var(--f-body)}
.lab-banner{display:flex;gap:14px;align-items:flex-start;background:var(--gold-soft);border:3px solid var(--gold);border-radius:18px;padding:14px 18px}
.lab-banner b{display:block;font:900 15px/1.2 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--gold-deep)}
.lab-banner p{font:700 clamp(19px,2vw,23px)/1.35 var(--f-body);color:var(--navy)}
.lab-cells{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,200px),1fr));gap:10px}
.lab-cell{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:center;border:3px solid var(--line);border-radius:16px;padding:10px 12px;background:var(--surface)}
.lab-cell .tm{font:900 22px/1 var(--f-display);color:var(--navy);font-variant-numeric:tabular-nums}
.lab-cell .stt{justify-self:end;font-size:14px;font-weight:800;color:#8A9BAB}
.lab-cell .stt.ok{color:var(--ok)}
.lab-cell .stt.err{color:var(--bad)}
.lab-cell label{grid-column:1/-1;display:flex;align-items:center;gap:8px;font-weight:800;color:var(--muted)}
.lab-cell input{width:100%;min-width:0;font:800 24px/1.1 var(--f-body);padding:8px 10px;border:2px solid var(--idle-line);border-radius:10px;font-variant-numeric:tabular-nums}
.lab-cell input:focus{outline:none;border-color:var(--sky-deep);box-shadow:0 0 0 4px var(--sky-soft)}
.lab-cell.has{border-color:var(--ok)}
.lab-cell.now{border-color:var(--gold);background:var(--gold-soft);box-shadow:0 0 0 4px rgba(242,183,5,.25)}
.lab-qs{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.lab-qs label{display:grid;gap:8px;font:800 clamp(18px,1.9vw,22px)/1.35 var(--f-body);color:var(--navy)}
.lab-qs textarea{font:600 19px/1.4 var(--f-body);padding:12px 14px;border:2px solid var(--idle-line);border-radius:14px;resize:vertical;min-height:84px;background:var(--surface);color:var(--ink)}
.lab-qs textarea:focus{outline:none;border-color:var(--sky-deep);box-shadow:0 0 0 4px var(--sky-soft)}
.flame{transform-box:fill-box;transform-origin:50% 100%;opacity:0;transition:opacity .4s}
.flame.on{opacity:1}
.bub{fill:#fff;stroke:#0284C7;stroke-width:.8}
.steam path{fill:none;stroke:#9FB3C6;stroke-width:3;stroke-linecap:round;opacity:.8}
@media (prefers-reduced-motion:no-preference){
  .flame.on{animation:flick .35s infinite alternate ease-in-out}
  .bub.rise{animation:rise 1.6s infinite linear}
  .steam path{animation:steam 2.2s infinite linear}
  .demo-bub{animation:rise 2.4s infinite linear}
}
@keyframes flick{from{transform:scale(.94,.9)}to{transform:scale(1.05,1.08)}}
@keyframes rise{from{transform:translateY(0);opacity:.95}to{transform:translateY(-34px);opacity:0}}
@keyframes steam{0%{transform:translateY(0);opacity:.8}100%{transform:translateY(-22px);opacity:0}}
@media (max-width:980px){
  .lgrid,.lab-grid{grid-template-columns:1fr}
  .lsecs{grid-template-columns:repeat(3,1fr)}
  .fcards{grid-template-columns:1fr}
  .lab-qs{grid-template-columns:1fr}
}
@media (max-width:640px){
  .lsecs{grid-template-columns:repeat(2,1fr)}
  .alt-read{grid-template-columns:1fr}
}

@media (max-width:980px){
  .home-row,.two{grid-template-columns:1fr}
  .fb-grid{grid-template-columns:1fr}
  .stepper{grid-template-columns:repeat(3,1fr)}
  .hero-body{max-width:none}
  .hero-sun{opacity:.35}
}
@media (max-width:640px){
  .hero{padding-left:calc(24px + 34px)}
  .hero-body{max-width:none}
  .hero-sun{opacity:.35}

  if (!k[5] || !k[6] || !k[8]) need.push('Q = cmΔt + rm есебінің қадамдары');
  if (!d.s2[1]) need.push('Қайнау кезінде температура тұрақты');
  if (sc.s1 < 3) need.push('Булану, конденсация, сублимация');
  need = need.slice(0, 3);
  if (!need.length) need.push('Жеке дескрипторлардың бәрі орындалды.');

  var next;
  if (fRm) next = 'Булануға арналған 2 қысқа есеп шығар (Q = rm).';
  else if (!k[1] || !k[4] || !k[3]) next = 'г → кг, кДж → Дж бойынша 5 айналдыру жаса.';
  else if (fP) next = 'Биіктік → қысым → қайнау температурасы тізбегін сызбамен қайтала.';
  else if (fHeat) next = 'Қыздыру + булану бойынша 1 аралас есеп шығар.';
  else if (sc.s1 < 3 || !d.s2[1]) next = 'Булану, конденсация және қайнау анықтамаларын қайтала.';
  else next = 'Q = cmΔt + rm түріндегі күрделі есеп шығарып көр.';

  var wrong = groupWrong(s.g);
  var gnote = wrong.length ? s.name + ' қатысқан топ ' + qWord(wrong) + ' қате жіберді.' : '';

  var motto;
  if (sc.ten >= 8) motto = 'Жарайсың, ' + s.name + '! Келесі қадам нәтижеңді жақсартуға көмектеседі.';
  else if (sc.ten >= 5) motto = 'Жақсы жұмыс, ' + s.name + '! Келесі қадам нәтижеңді жақсартуға көмектеседі.';
  else motto = 'Мұңайма, ' + s.name + '! Бұл — тек осы сабақтағы нәтижең. Алда біліміңді әлі де шыңдайсың!';

  var miss = [];
  d.s1.forEach(function(v,i){ if (!v) miss.push(S1_SHORT[i]); });
  d.s2.forEach(function(v,i){ if (!v) miss.push(S2_SHORT[i]); });
  k.forEach(function(v,i){ if (!v) miss.push(S4_SHORT[i]); });

  return { sc:sc, m15:m15, m16:m16, fRm:fRm, fSI:fSI, fP:fP, fHeat:fHeat, fRed:fRed, green:green, missed:missed, good:good, need:need, next:next, gnote:gnote, motto:motto, miss:miss };
}

/* ================= GRAPHICS ================= */
function sunSVG(cls){
  var d = '';
  for (var i=0;i<32;i++){
    var a = i * Math.PI * 2 / 32, a1 = a - 0.05, a2 = a + 0.05, r1 = 47, r2 = 80;
    d += 'M' + (Math.cos(a1)*r1).toFixed(1) + ' ' + (Math.sin(a1)*r1).toFixed(1) + 'L' + (Math.cos(a)*r2).toFixed(1) + ' ' + (Math.sin(a)*r2).toFixed(1) + 'L' + (Math.cos(a2)*r1).toFixed(1) + ' ' + (Math.sin(a2)*r1).toFixed(1) + 'Z';
  }
  return '<svg class="' + cls + '" viewBox="-84 -84 168 168" aria-hidden="true"><path d="' + d + '" fill="#F2B705"/><circle r="40" fill="#F2B705"/></svg>';
}

function labGraphSVG(){
  var W = 640, H = 380, m = { t:24, r:24, b:56, l:62 }, w = W - m.l - m.r, h = H - m.t - m.b;
  var X = function(v){ return m.l + v / 7 * w; }, Y = function(v){ return m.t + h - v / 110 * h; };
  var s = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Температураның уақытқа тәуелділік графигі">';
  [0, 20, 40, 60, 80].forEach(function(v){ s += '<line class="g-grid" x1="' + m.l + '" x2="' + (m.l + w) + '" y1="' + Y(v) + '" y2="' + Y(v) + '"/><text class="g-t" x="' + (m.l - 10) + '" y="' + (Y(v) + 4) + '" text-anchor="end">' + v + '</text>'; });
  s += '<line class="g-100" x1="' + m.l + '" x2="' + (m.l + w) + '" y1="' + Y(100) + '" y2="' + Y(100) + '"/><text class="g-100t" x="' + (m.l - 10) + '" y="' + (Y(100) + 4) + '" text-anchor="end">100</text>';
  for (var i = 0; i <= 7; i++) s += '<line class="g-grid" x1="' + X(i) + '" x2="' + X(i) + '" y1="' + m.t + '" y2="' + (m.t + h) + '"/><text class="g-t" x="' + X(i) + '" y="' + (m.t + h + 20) + '" text-anchor="middle">' + i + ':00</text>';
  s += '<line class="g-axis" x1="' + m.l + '" x2="' + (m.l + w) + '" y1="' + (m.t + h) + '" y2="' + (m.t + h) + '"/><line class="g-axis" x1="' + m.l + '" x2="' + m.l + '" y1="' + m.t + '" y2="' + (m.t + h) + '"/>';
  s += '<text class="g-title" x="' + (m.l + w / 2) + '" y="' + (H - 10) + '" text-anchor="middle">Уақыт, мин</text>';
  s += '<text class="g-title" transform="rotate(-90)" x="' + (-(m.t + h / 2)) + '" y="18" text-anchor="middle">Температура, °C</text>';
  var pts = [];
  S.lab.temps.forEach(function(v, i){ if (v !== null) pts.push([X(LAB_SLOTS[i].m), Y(Math.min(v, 110)), v]); });
  if (pts.length > 1) s += '<path class="g-line" d="M' + pts.map(function(p){ return p[0].toFixed(1) + ' ' + p[1].toFixed(1); }).join(' L') + '"/>';
  pts.forEach(function(p){ s += '<circle class="g-pt" cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="6"/><text class="g-val" x="' + p[0].toFixed(1) + '" y="' + (p[1] - 12).toFixed(1) + '" text-anchor="middle">' + fmtN(p[2], p[2] % 1 ? 1 : 0) + '°</text>'; });
  return s + '</svg>';
}
function labLast(){ for (var i = S.lab.temps.length - 1; i >= 0; i--) if (S.lab.temps[i] !== null) return S.lab.temps[i]; return null; }
function labPlateau(){
  var v = S.lab.temps.filter(function(x){ return x !== null; });
  if (v.length < 3) return false;
  var l = v.slice(-3);
  return Math.max.apply(null, l) - Math.min.apply(null, l) <= 1 && l[2] >= 80;
}
function labUpdate(){
  var g = document.getElementById('labGraph'); if (!g) return;
  g.innerHTML = labGraphSVG();
  var t = labLast(), cur = t === null ? 20 : t;

  if (fluid) fluid.setAttribute('y2', (225 - Math.min(cur, 110) / 110 * 150).toFixed(1));
  var now = document.getElementById('labNow'); if (now) now.textContent = t === null ? '— °C' : fmtN(t, t % 1 ? 1 : 0) + ' °C';
  var bub = document.getElementById('labBubbles'), stm = document.getElementById('labSteam'), b = '';
  if (bub) {
    if (cur >= 40) {
      var n = Math.min(Math.floor((cur - 30) / 5), 16), boil = cur >= 95;
      for (var i = 0; i < n; i++) {
        var bx = 114 + (i * 37) % 52, by = boil ? 220 + (i * 23) % 44 : 252 + (i * 11) % 14, r = boil ? 2.5 + (i % 3) * 1.5 : 1.5 + (i % 2);
        b += '<circle class="bub' + (boil ? ' rise' : '') + '" cx="' + bx + '" cy="' + by + '" r="' + r + '" style="animation-delay:-' + (i * 0.13).toFixed(2) + 's"/>';
      }
    }

  }
  if (stm) stm.innerHTML = cur >= 80 ? '<path d="M135 105 Q130 90 138 75 T132 60"/><path d="M142 105 Q148 90 140 75 T146 60"/><path d="M148 105 Q144 92 150 78 T144 62"/>' : '';

function labTickUI(){
  var idx = Math.min(14, Math.floor(lab.sec / 30));

  if (cd) cd.textContent = lab.sec >= 420 ? '00:00' : mmss(30 - lab.sec % 30);
  if (tot) tot.textContent = mmss(lab.sec) + ' / 07:00';
  document.querySelectorAll('.lab-cell').forEach(function(c, i){ c.classList.toggle('now', (lab.running || lab.sec > 0) && i === idx && lab.sec < 420); });
  var fl = document.getElementById('labFlame'); if (fl) fl.classList.toggle('on', lab.running);
  var badge = document.getElementById('labBadge'); if (badge) { badge.textContent = lab.running ? 'Қыздырғыш жанып тұр' : 'Қыздырғыш сөндірулі'; badge.classList.toggle('on', lab.running); }
  var sb = document.getElementById('labStart'); if (sb) sb.textContent = lab.running ? '❚❚ ТОҚТАТА ТҰРУ' : (lab.sec > 0 && lab.sec < 420 ? '▶ ЖАЛҒАСТЫРУ' : '▶ ТӘЖІРИБЕНІ БАСТАУ');
}
function labToggle(){
  if (lab.running) { clearInterval(lab.timer); lab.running = false; labTickUI(); return; }
  if (lab.sec >= 420) lab.sec = 0;
  lab.running = true;
  lab.timer = setInterval(function(){
    lab.sec++;
    if (lab.sec >= 420) { clearInterval(lab.timer); lab.running = false; toast('Тәжірибе уақыты аяқталды (7 мин)', 3000); }
    labTickUI();
  }, 1000);
  labTickUI();
}

/* ================= LIVE SYNC (shared db) =================
   Assessment data (names, marks, group results) is shared through the
   artifact's db when the page runs inside claude.ai: grp/g0..g3 hold
   {names, s3}; st/<studentId> holds {s1, s2, s4}. Lesson and lab state
   stay on each device. Without db the app works locally as before. */
var sync = { db:null, mode:'connecting', readonly:false, remoteGrp:{}, remoteSt:{}, pending:{}, queue:{}, inflight:{}, dirtyNames:{}, nameTimers:{}, renderPending:false, unsub:[] };

function syncLive(){ return !!sync.db && sync.mode === 'live'; }
function syncBadge(){
  var m = sync.mode, txt, cls;
  if (m === 'live') { txt = 'Барлық құрылғымен синхрондалады'; cls = 'live'; }
  else if (m === 'readonly') { txt = 'Тек қарау режимі'; cls = 'ro'; }
  else if (m === 'connecting') { txt = 'Қосылуда…'; cls = 'wait'; }
  else if (m === 'offline') { txt = 'Байланыс үзілді: деректер осы құрылғыда'; cls = 'ro'; }
  else { txt = 'Деректер тек осы құрылғыда'; cls = 'local'; }
  return '<span class="sync ' + cls + '" data-sync role="status"><i></i>' + txt + '</span>';
}
function updateBadges(){ document.querySelectorAll('[data-sync]').forEach(function(el){ el.outerHTML = syncBadge(); }); }

function cleanNames(a){ var o = []; for (var i=0;i<7;i++) o.push(Array.isArray(a) && typeof a[i] === 'string' ? a[i].slice(0, 40) : ''); return o; }
function cleanS3(a){ var o = []; for (var i=0;i<9;i++) o.push(Array.isArray(a) && (a[i] === 'ok' || a[i] === 'bad') ? a[i] : null); return o; }

function rebuildFromRemote(){
  for (var g=0; g<4; g++) {
    if (sync.pending['grp/g' + g]) continue;
    var d = sync.remoteGrp['g' + g];
    if (!sync.dirtyNames[g]) S.groups[g].names = cleanNames(d && d.names);
    S.groups[g].s3 = cleanS3(d && d.s3);
  }
  var next = {};
  Object.keys(sync.remoteSt).forEach(function(id){ if (/^g[0-3]s[0-6]$/.test(id)) next[id] = normSt(sync.remoteSt[id]); });
  Object.keys(S.st).forEach(function(id){ if (sync.pending['st/' + id]) next[id] = S.st[id]; });
  S.st = next;
  S.sample = false;
  save();
}

function isTyping(){
  var ae = document.activeElement;
  return !!(ae && app.contains(ae) && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName));
}
function scheduleRender(){
  if (S.ui.view === 'lesson' || S.ui.view === 'home') { updateBadges(); renderOverlay(); return; }
  if (isTyping()) { sync.renderPending = true; updateBadges(); return; }
  render();
}
document.addEventListener('focusout', function(){
  setTimeout(function(){ if (sync.renderPending && !isTyping()) { sync.renderPending = false; render(); } }, 300);
});

function enqueue(path, fn){
  sync.queue[path] = fn; sync.pending[path] = true;
  if (!sync.inflight[path]) runQueue(path);
}
function runQueue(path){
  var fn = sync.queue[path]; delete sync.queue[path];
  sync.inflight[path] = true;
  var attempt = function(retry){
    return fn().catch(function(err){
      var code = err && err.code;
      if (code === 'unavailable' && retry) return new Promise(function(r){ setTimeout(r, 600 + Math.random() * 900); }).then(function(){ return attempt(false); });
      if (code === 'invalid_argument') { sync.readonly = true; sync.mode = 'readonly'; toast('Бұл құрылғыда өзгерту құқығы жоқ: тек қарау режимі.', 5000); }
      else if (code === 'quota_exceeded') toast('Дерекқор толды. Мұғалім ескі деректі тазартуы керек.', 5000);
      else if (code === 'revoked') { sync.mode = 'offline'; }
      else toast('Сақтау сәтсіз аяқталды. Қайталап көріңіз.', 3500);
    });
  };
  attempt(true).then(function(){
    if (sync.queue[path]) { runQueue(path); return; }
    sync.inflight[path] = false; delete sync.pending[path];
    if (!Object.keys(sync.pending).length) { rebuildFromRemote(); scheduleRender(); }
    else updateBadges();
  });
}
function pushSt(id){
  if (!syncLive()) return;
  enqueue('st/' + id, function(){
    var d = S.st[id], ref = sync.db.doc('st/' + id);
    return d ? ref.set({ s1:d.s1.slice(), s2:d.s2.slice(), s4:d.s4.slice() }) : ref.delete();
  });
}
function pushGrp(g, fields){
  if (!syncLive()) return;
  enqueue('grp/g' + g, function(){
    var ref = sync.db.doc('grp/g' + g), G = S.groups[g];
    if (sync.remoteGrp['g' + g]) { var o = {}; fields.forEach(function(f){ o[f] = G[f].slice(); }); return ref.update(o); }
    return ref.set({ names:G.names.slice(), s3:G.s3.slice() });
  });
}
function queueNames(g){
  if (!syncLive()) return;
  sync.dirtyNames[g] = true;
  clearTimeout(sync.nameTimers[g]);
  sync.nameTimers[g] = setTimeout(function(){ delete sync.dirtyNames[g]; pushGrp(g, ['names']); }, 700);
}
function clearRemote(){
  if (!syncLive()) return;
  Object.keys(sync.remoteSt).forEach(function(id){ enqueue('st/' + id, function(){ return sync.db.doc('st/' + id).delete(); }); });
  for (var g=0; g<4; g++) (function(g){ if (sync.remoteGrp['g' + g]) enqueue('grp/g' + g, function(){ return sync.db.doc('grp/g' + g).delete(); }); })(g);
}
function editBlocked(){
  if (!sync.readonly) return false;
  toast('Бұл құрылғыда өзгерту құқығы жоқ: тек қарау режимі.', 3500);
  return true;
}

function subscribe(){
  var onErr = function(e){
    if (e && e.code === 'unavailable') { setTimeout(function(){ sync.unsub.forEach(function(u){ u(); }); sync.unsub = []; subscribe(); }, 3000); return; }
    sync.mode = 'offline'; updateBadges();
  };
  sync.unsub.push(sync.db.collection('grp').onSnapshot(function(snap){
    var m = {}; snap.docs.forEach(function(d){ if (d.exists) m[d.id] = d.data(); });
    sync.remoteGrp = m; rebuildFromRemote(); scheduleRender();
  }, onErr));
  sync.unsub.push(sync.db.collection('st').onSnapshot(function(snap){
    var m = {}; snap.docs.forEach(function(d){ if (d.exists) m[d.id] = d.data(); });
    sync.remoteSt = m; rebuildFromRemote(); scheduleRender();
  }, onErr));
}

function initSync(){
  if (!window.claude || typeof window.claude.use !== 'function') { sync.mode = 'local'; updateBadges(); return; }
  var dbP = window.claude.use('db'), userP = window.claude.use('user');
  Promise.all([dbP, userP]).then(function(r){
    var db = r[0], user = r[1];
    if (!db) { sync.mode = 'local'; updateBadges(); return; }
    return (user ? user.can('data.write') : Promise.resolve(null)).then(function(cw){
      sync.db = db; sync.readonly = cw === false;
      return Promise.all([db.collection('grp').get(), db.collection('st').get()]).then(function(q){
        var empty = q[0].empty && q[1].empty;
        q[0].docs.forEach(function(d){ if (d.exists) sync.remoteGrp[d.id] = d.data(); });
        q[1].docs.forEach(function(d){ if (d.exists) sync.remoteSt[d.id] = d.data(); });
        sync.mode = sync.readonly ? 'readonly' : 'live';
        if (empty && !sync.readonly && !S.sample && allStudents().length) {
          for (var g=0; g<4; g++) if (S.groups[g].names.some(function(n){ return n.trim(); }) || S.groups[g].s3.some(function(v){ return v; })) pushGrp(g, ['names', 's3']);
          allStudents().forEach(function(s){ if (S.st[s.id]) pushSt(s.id); });
        } else {
          rebuildFromRemote();
        }
        subscribe();
        scheduleRender();
      });
    });
  }).catch(function(){ if (!sync.db) sync.mode = 'local'; else sync.mode = 'offline'; updateBadges(); });
}

/* ================= EVENTS ================= */
document.addEventListener('click', function(e){
  var b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  var a = b.getAttribute('data-act'), d = b.dataset, g = S.ui.g, x;
  if (['s1','s2','s3','s4','clear','sample'].indexOf(a) >= 0 && editBlocked()) return;
  switch (a) {
    case 'go':
      S.ui.view = d.view;
      if (d.g != null) { S.ui.g = +d.g; if (!students(+d.g).length) S.ui.gstep[+d.g] = 0; else if (S.ui.gstep[+d.g] === 0) S.ui.gstep[+d.g] = 1; }
      save(); render(); window.scrollTo(0, 0); break;
    case 'step': S.ui.gstep[g] = +d.step; save(); render(); window.scrollTo(0, 0); break;
    case 'next': S.ui.gstep[g] = Math.min(5, S.ui.gstep[g] + 1); save(); render(); window.scrollTo(0, 0); toast('Сақталды ✓'); break;
    case 's1': case 's2': case 's4': x = st(d.id)[a]; x[+d.i] = !x[+d.i]; save(); render(); pushSt(d.id); break;
    case 's3': x = S.groups[g].s3; x[+d.q] = x[+d.q] === d.v ? null : d.v; save(); render(); pushGrp(g, ['s3']); break;
    case 'sel': S.ui.sel[g] = +d.slot; save(); render(); break;
    case 'selmove': {
      var l = students(g), cur = l.filter(function(s){ return s.slot === S.ui.sel[g]; })[0] || l[0], k = l.indexOf(cur) + (+d.d);
      if (l[k]) { S.ui.sel[g] = l[k].slot; save(); render(); }
      break;
    }
    case 'show': S.ui.result = d.id; renderOverlay(); overlay.scrollTop = 0; break;
    case 'close': S.ui.result = null; renderOverlay(); break;
    case 'res-move': {
      var al = allStudents(), j = al.map(function(s){ return s.id; }).indexOf(S.ui.result) + (+d.d);
      if (al[j]) { S.ui.result = al[j].id; renderOverlay(); overlay.scrollTop = 0; }
      break;
    }
    case 'print-one': { var one = findStudent(S.ui.result); printSheets(one ? [one] : []); break; }
    case 'print-group': printSheets(students(g)); break;
    case 'print-all': printSheets(allStudents()); break;
    case 'copy': {
      var pre = document.getElementById('briefText'), txt = pre ? pre.textContent : '';
      var fallback = function(){ toast('Көшіру мүмкін болмады. Мәтінді экраннан көшіріңіз.', 3500); };
      try { navigator.clipboard.writeText(txt).then(function(){ toast('Қорытынды көшірілді'); }, fallback); } catch(err) { fallback(); }
      break;
    }
    case 'clear': openModal(syncLive() ? 'Барлық енгізілген деректер БАРЛЫҚ құрылғыдан өшіріледі. Жалғастырасыз ба?' : null); break;
    case 'modal-no': closeModal(); break;
    case 'modal-yes':
      clearRemote(); labStop(); S = blankState(); try { localStorage.removeItem(LS_KEY); } catch(err) {}
      closeModal(); render(); window.scrollTo(0, 0); toast('Барлық дерек өшірілді'); break;
    case 'sample': loadSample(); break;
    case 'lsec': S.ui.lsec = +d.s; save(); render(); window.scrollTo(0, 0); break;
    case 'ex-next': S.ui.ex = Math.min(EX_STEPS.length, S.ui.ex + 1); save(); render(); break;
    case 'ex-reset': S.ui.ex = 0; save(); render(); break;
    case 'alt': S.ui.alt = +d.h; save(); render(); break;
    case 'lab-start': labToggle(); break;
    case 'lab-clear': openModal('Кестедегі барлық температура мәндері өшіріледі. Жалғастырасыз ба?', 'lab-clear-yes'); break;
    case 'lab-reset': openModal('Таймер тоқтап, кестедегі мәндер мен талдау жауаптары өшіріледі. Жалғастырасыз ба?', 'lab-reset-yes'); break;
    case 'lab-clear-yes': S.lab.temps = range(15).map(function(){ return null; }); save(); closeModal(); render(); toast('График тазаланды'); break;
    case 'lab-reset-yes': labStop(); S.lab = { temps: range(15).map(function(){ return null; }), ans: ['', '', '', '', '', ''] }; save(); closeModal(); render(); toast('Тәжірибе қайта басталды'); break;
  }
});
document.addEventListener('input', function(e){
  var t = e.target;
  if (t.classList && t.classList.contains('name-input')) {
    if (sync.readonly) { t.value = S.groups[+t.dataset.g].names[+t.dataset.i]; editBlocked(); return; }

    document.getElementById('altH').innerHTML = hv + '<small> м</small>';
    document.getElementById('altP').innerHTML = '≈ ' + fmtN(av.p, 1) + '<small> кПа</small>';
    document.getElementById('altT').innerHTML = '≈ ' + fmtN(av.t, 1) + '<small> °C</small>';
    document.getElementById('altFig').innerHTML = altFigSVG(hv);
    document.querySelectorAll('.presets .btn').forEach(function(b){ b.classList.toggle('cur', +b.dataset.h === hv); });
  }
});
document.addEventListener('change', function(e){
  var t = e.target;
  if (t.id === 's4sel') { S.ui.sel[S.ui.g] = +t.value; save(); render(); }
  if (t.classList && t.classList.contains('name-input') && !t.value.trim()) {
    delete S.st['g' + t.dataset.g + 's' + t.dataset.i]; save(); pushSt('g' + t.dataset.g + 's' + t.dataset.i);
  }
});
document.addEventListener('keydown', function(e){
  if (e.key !== 'Escape') return;
  if (!modal.hidden) closeModal();
  else if (S.ui.result) { S.ui.result = null; renderOverlay(); }
});

render();
initSync();
})();
</script>
</body>
</html>
